name: Update and publish dashboard

# Refreshes the nflverse game data every Tuesday (after Monday Night Football),
# rebuilds dashboard/nfl_dashboard.html, commits the result and publishes it
# to GitHub Pages. Also runs on every push to main and on demand.
on:
  schedule:
    - cron: "17 10 * * 2"   # Tuesdays 10:17 UTC (early morning US time)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.0" "numpy>=1.24"

      - name: Download latest game data
        if: github.event_name != 'push'
        run: python scripts/fetch_data.py

      - name: Rebuild dashboard
        run: python scripts/build_dashboard.py

      - name: Commit refreshed data and dashboard
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/raw/games.csv; then
            echo "No new game data."
            git checkout -- dashboard/nfl_dashboard.html
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/games.csv dashboard/nfl_dashboard.html
            git commit -m "Refresh game data and rebuild dashboard"
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard/nfl_dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
