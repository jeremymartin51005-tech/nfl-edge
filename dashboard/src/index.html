<title>NFL EDGE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive historical NFL results and closing betting lines, 2020 onward.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky two-row header (brand + tabs, then the global filter bar), removable filter chips,
   then each tab as page heading -> KPI row -> question-led sections of cards.
   Deliberately one dark look (charcoal, stadium at night), set explicitly so it reads the same on any host. */
:root {
  color-scheme: dark;
  --bg: #0e1012;
  --bar: #121518;
  --panel: #15181c;
  --panel-2: #1b1f24;
  --line: #272c33;
  --text: #e8ebef;
  --muted: #959ea9;
  --faint: #6b7480;
  --blue: #4c8fe6;
  --orange: #e2783c;
  --teal: #2fa88a;
  --violet: #9284ea;
  --good: #3cb879;
  --bad: #e2604f;
  --warn: #d9a338;
  --mark-muted: #4f5761;
  --ref: #8a939e;
  --heat-lo: #1d2530;
  --heat-mid: #2a2f36;
  --display: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
code { font-size: 0.92em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); }

/* ---- header ---- */
.top { background: var(--bar); border-bottom: 1px solid var(--line); z-index: 20; }
@media (min-width: 900px) { .top { position: sticky; top: env(safe-area-inset-top, 0px); } }
.top-in { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 24px; padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 12px; padding-bottom: 9px; min-width: 0; }
.brand h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }
.brand h1 span { color: var(--blue); }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 11px 9px; font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }
#filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; padding-block: 9px 10px; border-top: 1px solid var(--line); }
.ctl { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; min-width: 0; }
.ctl > span { padding-left: 1px; white-space: nowrap; }
.ctl select, .ctl input[type="search"], .ctl input[type="number"], .ctl input[type="date"] { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; min-width: 0; max-width: 100%; height: 31px; }
.ctl input[type="date"] { width: 9.4rem; }
.ctl input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
.ctl.check { flex-direction: row; align-items: center; gap: 7px; height: 31px; text-transform: none; font-size: 13px; letter-spacing: 0; color: var(--text); }
.ctl.grow { flex: 1 1 14rem; }
.ctl.grow input { width: 100%; }
.pair, .range { display: flex; align-items: center; gap: 6px; }
.pair i, .range i { font-style: normal; color: var(--faint); text-transform: none; letter-spacing: 0; font-size: 12px; }
.range input { width: 4.8rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); height: 31px; }
.seg button { border: 0; background: none; padding: 0 11px; font-size: 13px; color: var(--muted); cursor: pointer; text-transform: none; letter-spacing: 0; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.btn { background: var(--blue); color: #fff; border: 1px solid var(--blue); border-radius: 7px; padding: 0 12px; height: 31px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn.ghost:hover:not(:disabled) { background: var(--panel-2); filter: none; }
.btn:disabled { opacity: 0.4; cursor: default; }
.reset { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 12px 4px; }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: none; line-height: 1.5; }
.chip.strong { color: var(--text); border-color: #2f4f78; background: #15233a; }
.chip.on { color: var(--text); border-color: #3c4652; background: var(--panel-2); cursor: pointer; }
.chip.on i { font-style: normal; color: var(--muted); margin-left: 3px; }
.chip.on:hover { border-color: var(--bad); }
.chip.on:hover i { color: var(--bad); }

/* ---- page ---- */
main { padding-block: 4px 48px; }
#view { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.page-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; margin-top: 4px; }
.page-h h2 { font-size: 28px; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 92ch; }
.lede b { color: var(--text); font-weight: 600; }
.sec { margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); scroll-margin-top: 130px; }
.sec h2 { font-size: 21px; }
.sec p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 130px; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; }
.card-h > div:first-child { min-width: 0; flex: 1 1 18rem; }
.card h3 { font-size: 18px; display: inline-flex; align-items: center; gap: 7px; }
.card-c { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.note { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; max-width: 86ch; }
.note b { color: var(--text); font-weight: 600; }
.chart { position: relative; min-height: 200px; }
.chart svg { display: block; overflow: visible; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: 14px; }
.grid.top { align-items: start; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 34rem), 1fr)); align-items: start; }
.grid > .wide { grid-column: 1 / -1; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--faint); }
.jump button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--text); cursor: pointer; }
.jump button:hover { border-color: var(--blue); }
.empty { color: var(--muted); margin: 12px 0; }
.callout { margin: 0; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: var(--r); padding: 11px 14px; color: var(--muted); max-width: 130ch; }
.callout b { color: var(--text); font-weight: 600; }
.callout.warn { border-left-color: var(--warn); }
.info { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid #4a535e; color: var(--muted); font-family: var(--body); font-size: 10px; font-weight: 600; font-style: normal; cursor: help; flex: none; text-transform: none; letter-spacing: 0; vertical-align: middle; }
.info:hover, .info:focus-visible { color: var(--text); border-color: var(--blue); }

/* ---- KPIs ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 13px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kpi.clickable { cursor: pointer; }
.kpi.clickable:hover { border-color: #3a4552; background: var(--panel-2); }
.kpi-l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 6px; }
.kpi-v { font-family: var(--display); font-size: 29px; font-weight: 600; line-height: 1.12; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.up .kpi-v { color: var(--good); }
.kpi.down .kpi-v { color: var(--bad); }
.kpi-ci { font-size: 12px; color: var(--text); opacity: 0.85; font-variant-numeric: tabular-nums; }
.kpi-s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi-f { margin-top: 5px; }
.kpi-spark { display: block; margin-top: 5px; height: 26px; }
.spark { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.pill.good { background: rgba(60, 184, 121, 0.15); color: var(--good); }
.pill.bad { background: rgba(226, 96, 79, 0.15); color: var(--bad); }
.pill.neutral { background: rgba(149, 158, 169, 0.15); color: var(--muted); }
.pill.warn { background: rgba(217, 163, 56, 0.15); color: var(--warn); }

/* ---- story ---- */
.story { display: flex; flex-direction: column; gap: 18px; }
.story-lede { font-family: var(--display); font-size: 24px; font-weight: 500; line-height: 1.3; margin: 6px 0 0; max-width: 48ch; }
.chapter { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; scroll-margin-top: 130px; }
.chapter-t { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.chapter-t h2 { font-size: 26px; line-height: 1.15; }
.chapter-t p { margin: 0; color: var(--muted); max-width: 54ch; }
.chapter-t .btn { height: auto; padding: 6px 12px; }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blue); font-weight: 600; }
.takeaways ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); max-width: 95ch; }
.takeaways b { color: var(--text); }
@media (max-width: 860px) { .chapter { grid-template-columns: minmax(0, 1fr); } }

/* ---- tables ---- */
.tbl { overflow: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 34rem; }
.tbl.tall { max-height: 38rem; }
.tbl.short { max-height: none; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-weight: 600; color: var(--muted); padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
th .info { margin-left: 5px; }
td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.num { text-align: right; }
td.up { color: var(--good); }
td.down { color: var(--bad); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--panel-2); }
tr.picked td { background: #17263b; }
tr.flag td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: var(--text); }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--blue); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--blue); }
.pager { display: flex; gap: 12px; align-items: center; justify-content: flex-end; color: var(--muted); font-size: 12.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.explorer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18rem, 24rem); gap: 14px; align-items: start; }
.explorer aside { position: sticky; top: 150px; }
@media (max-width: 1060px) { .explorer { grid-template-columns: minmax(0, 1fr); } .explorer aside { position: static; } }
.detail h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; margin-top: 4px; }
.score { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; margin: 2px 0; }
.score span { font-family: var(--display); font-size: 20px; color: var(--muted); }
.score span small { font-family: var(--body); font-size: 11px; color: var(--faint); }
.score b { font-family: var(--display); font-size: 28px; font-weight: 600; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.score .w { color: var(--text); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 2px 0 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
.kv.wide { grid-template-columns: minmax(9rem, auto) 1fr; gap: 8px 18px; }
.kv.wide dd { text-align: left; color: var(--muted); max-width: 90ch; }
.kv.wide dt { color: var(--text); font-weight: 600; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 28rem), 1fr)); gap: 8px 18px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.checks li .pill { min-width: 4.4rem; text-align: center; margin-top: 1px; }
.checks b { font-weight: 600; }
.checks p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.explain { color: var(--muted); max-width: 95ch; }
.explain table { max-width: 28rem; margin: 6px 0; }
.csv-out { width: 100%; height: 9rem; resize: vertical; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 8px; font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.sim-out { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.sim-out b { color: var(--text); }

/* ---- trend lab ---- */
.lab { border-color: #2c3d52; }
.lab-out { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 20px; align-items: start; border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 900px) { .lab-out { grid-template-columns: minmax(0, 1fr); } }
.lab-num { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.lab-label { color: var(--muted); font-size: 12.5px; }
.lab-rate { font-family: var(--display); font-size: 52px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.lab-sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.lab-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.lab-num .btn { margin-top: 6px; }
.lab-charts { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* ---- chart marks ---- */
.tick { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.tick.sel { fill: var(--text); font-weight: 600; }
.legend { font-size: 12px; fill: var(--muted); }
.axis-t { font-size: 11.5px; fill: var(--faint); }
.bar-label { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.pt-label { font-size: 11px; fill: var(--text); font-weight: 600; }
.ref-t { font-size: 10.5px; fill: var(--faint); }
.strip-sd { font-size: 11px; fill: var(--faint); }
line.grid { stroke: #22272d; stroke-width: 1; }
line.axis { stroke: #3a414a; stroke-width: 1; }
line.ref { stroke: var(--ref); stroke-width: 1; stroke-dasharray: 4 3; }
line.ref.warn { stroke: var(--warn); }
line.fit { stroke: var(--text); stroke-width: 1.6; opacity: 0.75; }
line.hover-rule { stroke: #48515c; stroke-width: 1; }
.whisker line { stroke: var(--text); stroke-width: 1.2; opacity: 0.65; }
path.line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
circle.dot { stroke: var(--panel); stroke-width: 1.5; }
.box-w { stroke: var(--muted); stroke-width: 1; }
.box-m { stroke: var(--text); stroke-width: 2; }
.clickable { cursor: pointer; }
rect.clickable:hover, circle.clickable:hover, g.clickable:hover rect { filter: brightness(1.25); }
.tip { position: fixed; z-index: 50; background: #20252c; border: 1px solid #343b45; border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); padding: 7px 10px; font-size: 12px; pointer-events: none; max-width: 340px; }
.tip-h { color: var(--muted); margin-bottom: 3px; }
.tip-r { display: flex; gap: 7px; align-items: center; }
.tip-r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.tip-r b { margin-left: auto; padding-left: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip-hint { margin-top: 4px; color: var(--blue); font-size: 11px; }
.tip-text { color: var(--text); line-height: 1.45; text-transform: none; letter-spacing: 0; font-weight: 400; }
footer { color: var(--faint); font-size: 12px; padding-block: 0 32px; }
@media (prefers-reduced-motion: no-preference) { .card, .kpi, .chip { transition: border-color 0.15s ease, background 0.15s ease; } }
@media (max-width: 640px) { .brand h1 { font-size: 22px; } .brand p { display: none; } .kpi-v { font-size: 25px; } .chapter-t h2 { font-size: 22px; } .story-lede { font-size: 20px; } .page-h h2 { font-size: 24px; } .reset { margin-left: 0; } .lab-rate { font-size: 42px; } }
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><h1>NFL <span>EDGE</span></h1><p>NFL results against the closing line, 2020 on. History, not predictions.</p></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </div>
  <div class="wrap" id="filters" aria-label="Filters"></div>
</header>
<main class="wrap">
  <div class="chips" id="chips" aria-live="polite"></div>
  <div id="view"></div>
</main>
