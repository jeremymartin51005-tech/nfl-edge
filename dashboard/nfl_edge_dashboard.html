<title>NFL EDGE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky header with global filters, tab rail, then a responsive card grid per tab.
   Deliberately one dark look (stadium-at-night charcoal), set explicitly so it reads the same on any host. */
:root {
  color-scheme: dark;
  --bg: #0e1012;
  --panel: #15181c;
  --panel-2: #1b1f24;
  --line: #272c33;
  --text: #e8ebef;
  --muted: #959ea9;
  --faint: #6b7480;
  --blue: #4c8fe6;
  --orange: #e2783c;
  --teal: #2fa88a;
  --violet: #9284ea;
  --good: #3cb879;
  --bad: #e2604f;
  --warn: #d9a338;
  --mark-muted: #4f5761;
  --ref: #8a939e;
  --heat-lo: #1d2530;
  --heat-mid: #2a2f36;
  --display: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
code { font-size: 0.92em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(14, 16, 18, 0.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; padding-block: 10px 8px; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.08em; }
.brand h1 span { color: var(--blue); }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
#filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; min-width: 0; }
.ctl > span { padding-left: 1px; }
.ctl select, .ctl input[type="search"] { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; min-width: 0; max-width: 100%; }
.ctl.check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; text-transform: none; font-size: 13px; letter-spacing: 0; color: var(--text); }
.ctl.grow { flex: 1 1 14rem; }
.ctl.grow input { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 13px; color: var(--muted); cursor: pointer; text-transform: none; letter-spacing: 0; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.btn { background: var(--blue); color: #fff; border: 1px solid var(--blue); border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:disabled { opacity: 0.4; cursor: default; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px 9px; font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 12px 2px; }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.chip.strong { color: var(--text); border-color: #2f4f78; background: #15233a; }

/* page */
main { display: flex; flex-direction: column; gap: 14px; padding-block: 12px 48px; }
#view { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; }
.card-h > div:first-child { min-width: 0; flex: 1 1 16rem; }
.card h3 { font-size: 18px; }
.card-c { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.note { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; max-width: 78ch; }
.note b { color: var(--text); font-weight: 600; }
.chart { position: relative; min-height: 200px; }
.chart svg { display: block; overflow: visible; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: 14px; }
.grid > .wide { grid-column: 1 / -1; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.hint-line { margin: -4px 0 0; font-size: 12px; color: var(--faint); }
.empty { color: var(--muted); margin: 12px 0; }
.callout { margin: 0; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: var(--r); padding: 11px 14px; color: var(--muted); max-width: 120ch; }
.callout b { color: var(--text); font-weight: 600; }
.callout.warn { border-left-color: var(--warn); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.25rem), 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 13px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; position: relative; }
.kpi.clickable { cursor: pointer; }
.kpi.clickable:hover { border-color: #3a4552; background: var(--panel-2); }
.kpi-l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-v { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.12; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.up .kpi-v { color: var(--good); }
.kpi.down .kpi-v { color: var(--bad); }
.kpi-ci { font-size: 12px; color: var(--text); opacity: 0.85; font-variant-numeric: tabular-nums; }
.kpi-s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi-d { font-size: 11.5px; color: var(--faint); margin-top: 4px; line-height: 1.35; }
.kpi-spark { display: block; margin-top: 4px; height: 26px; }
.spark { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.pill.good { background: rgba(60, 184, 121, 0.15); color: var(--good); }
.pill.bad { background: rgba(226, 96, 79, 0.15); color: var(--bad); }
.pill.neutral { background: rgba(149, 158, 169, 0.15); color: var(--muted); }

/* insights */
.insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 10px; }
.insight { margin: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; color: var(--muted); font-size: 13px; }
.insight span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin-bottom: 2px; }
.insight b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

/* story */
.story { display: flex; flex-direction: column; gap: 18px; }
.story-lede { font-family: var(--display); font-size: 24px; font-weight: 500; line-height: 1.3; margin: 6px 0 0; max-width: 46ch; }
.chapter { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; }
.chapter-t { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.chapter-t h2 { font-size: 26px; line-height: 1.15; }
.chapter-t p { margin: 0; color: var(--muted); max-width: 52ch; }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blue); font-weight: 600; }
.takeaways ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); max-width: 90ch; }
.takeaways b { color: var(--text); }
@media (max-width: 860px) { .chapter { grid-template-columns: minmax(0, 1fr); } }

/* tables */
.tbl { overflow: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 34rem; }
.tbl.tall { max-height: 40rem; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-weight: 600; color: var(--muted); padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.num { text-align: right; }
td.muted { color: var(--muted); }
tr.clickable, table.gx tbody tr { cursor: pointer; }
tr.clickable:hover td, table.gx tbody tr:hover td { background: var(--panel-2); }
table.gx tbody tr.picked td { background: #17263b; }
th[data-sort] { cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--blue); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--blue); }
.pager { display: flex; gap: 12px; align-items: center; justify-content: flex-end; color: var(--muted); font-size: 12.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.explorer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18rem, 23rem); gap: 14px; align-items: start; }
.explorer aside { position: sticky; top: 140px; }
@media (max-width: 1000px) { .explorer { grid-template-columns: minmax(0, 1fr); } .explorer aside { position: static; } }
.detail h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; margin-top: 6px; }
.score { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; margin: 4px 0; }
.score span { font-family: var(--display); font-size: 20px; color: var(--muted); }
.score span small { font-family: var(--body); font-size: 11px; color: var(--faint); }
.score b { font-family: var(--display); font-size: 28px; font-weight: 600; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.score .w { color: var(--text); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 4px 0 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
.kv.wide dd { text-align: left; color: var(--muted); }
.kv.wide dt { color: var(--text); font-weight: 600; }
.list { margin: 4px 0 0; padding-left: 18px; color: var(--muted); display: grid; gap: 5px; }
.explain { color: var(--muted); max-width: 90ch; }
.explain table { max-width: 26rem; margin: 6px 0; }
.sim-out { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.sim-out b { color: var(--text); }

/* chart marks */
.tick { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.tick.sel { fill: var(--text); font-weight: 600; }
.tick-sm { font-size: 10px; }
.legend { font-size: 12px; fill: var(--muted); }
.axis-t { font-size: 11.5px; fill: var(--faint); }
.bar-label { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.pt-label { font-size: 11px; fill: var(--text); font-weight: 600; }
.ref-t { font-size: 10.5px; fill: var(--faint); }
.strip-sd { font-size: 11px; fill: var(--faint); }
line.grid { stroke: #22272d; stroke-width: 1; }
line.axis { stroke: #3a414a; stroke-width: 1; }
line.ref { stroke: var(--ref); stroke-width: 1; stroke-dasharray: 4 3; }
line.fit { stroke: var(--ref); stroke-width: 1.6; }
line.hover-rule { stroke: #48515c; stroke-width: 1; }
.whisker line { stroke: var(--text); stroke-width: 1.2; opacity: 0.65; }
path.line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
circle.dot { stroke: var(--panel); stroke-width: 1.5; }
.box-w { stroke: var(--muted); stroke-width: 1; }
.box-m { stroke: var(--text); stroke-width: 2; }
.clickable { cursor: pointer; }
rect.clickable:hover, circle.clickable:hover, g.clickable:hover rect { filter: brightness(1.25); }
.tip { position: fixed; z-index: 50; background: #20252c; border: 1px solid #343b45; border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); padding: 7px 10px; font-size: 12px; pointer-events: none; max-width: 320px; }
.tip-h { color: var(--muted); margin-bottom: 3px; }
.tip-r { display: flex; gap: 7px; align-items: center; }
.tip-r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tip-r b { margin-left: auto; padding-left: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tip-hint { margin-top: 4px; color: var(--blue); font-size: 11px; }
footer { color: var(--faint); font-size: 12px; padding-block: 0 32px; }
@media (prefers-reduced-motion: no-preference) { .card, .kpi { transition: border-color 0.15s ease, background 0.15s ease; } }
@media (max-width: 640px) { .brand h1 { font-size: 22px; } .kpi-v { font-size: 25px; } .chapter-t h2 { font-size: 22px; } .story-lede { font-size: 20px; } }
</style>
</head>

<script>
// NFL EDGE: data preparation, statistics and app state.
// Conventions: spread_line = points the HOME team was favored by (positive = home favored).
// A team's own line is sportsbook style (negative = favored). ATS margin = team margin + own line.
'use strict';

const NE = (window.NE = {});

// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------
NE.raw = JSON.parse(document.getElementById('ne-data').textContent);

NE.buildGames = () => {
  const { cols, rows } = NE.raw;
  const ix = Object.fromEntries(cols.map((c, i) => [c, i]));
  const v = (r, c) => (r[ix[c]] === undefined ? null : r[ix[c]]);
  const settle = (m, w, p, l) => (m === null ? null : m > 0 ? w : m < 0 ? l : p);
  const prob = (ml) => (ml === null ? null : ml < 0 ? -ml / (-ml + 100) : 100 / (ml + 100));
  const seen = new Set();
  const out = [];
  for (const r of rows) {
    const id = v(r, 'game_id');
    const hs = v(r, 'home_score');
    const as = v(r, 'away_score');
    if (hs === null || as === null || seen.has(id)) continue;
    seen.add(id);
    const sl = v(r, 'spread_line');
    const tl = v(r, 'total_line');
    const hml = v(r, 'home_moneyline');
    const aml = v(r, 'away_moneyline');
    const result = hs - as;
    const total = hs + as;
    let fav = null;
    if (sl !== null && sl > 0) fav = 'home';
    else if (sl !== null && sl < 0) fav = 'away';
    else if (sl === 0 && hml !== null && aml !== null && hml !== aml) fav = hml < aml ? 'home' : 'away';
    const home = v(r, 'home_team');
    const away = v(r, 'away_team');
    const favLine = fav ? Math.abs(sl) : null;
    const favMargin = fav ? (fav === 'home' ? result : -result) : null;
    const homeAts = sl === null ? null : result - sl;
    const ou = tl === null ? null : total - tl;
    const hp = prob(hml);
    const ap = prob(aml);
    const hsp = prob(v(r, 'home_spread_odds'));
    const asp = prob(v(r, 'away_spread_odds'));
    const op = prob(v(r, 'over_odds'));
    const up = prob(v(r, 'under_odds'));
    out.push({
      game_id: id,
      season: v(r, 'season'),
      week: v(r, 'week'),
      game_type: v(r, 'game_type'),
      phase: v(r, 'game_type') === 'REG' ? 'REG' : 'POST',
      date: v(r, 'gameday'),
      home_team: home,
      away_team: away,
      home_score: hs,
      away_score: as,
      neutral: v(r, 'location') === 'Neutral',
      overtime: v(r, 'overtime') === 1,
      result,
      total_pts: total,
      abs_margin: Math.abs(result),
      winner: result > 0 ? home : result < 0 ? away : 'TIE',
      spread_line: sl,
      home_spread: sl === null ? null : -sl,
      total_line: tl,
      home_ml: hml,
      away_ml: aml,
      home_spread_odds: v(r, 'home_spread_odds'),
      away_spread_odds: v(r, 'away_spread_odds'),
      over_odds: v(r, 'over_odds'),
      under_odds: v(r, 'under_odds'),
      favorite: fav === 'home' ? home : fav === 'away' ? away : null,
      underdog: fav === 'home' ? away : fav === 'away' ? home : null,
      fav_side: fav,
      fav_line: favLine,
      fav_margin: favMargin,
      fav_su: settle(favMargin, 'W', 'T', 'L'),
      fav_ats_margin: fav ? favMargin - favLine : null,
      fav_ats: fav ? settle(favMargin - favLine, 'Cover', 'Push', 'No Cover') : null,
      home_ats_margin: homeAts,
      home_ats: settle(homeAts, 'Cover', 'Push', 'No Cover'),
      ats_winner: homeAts === null ? null : homeAts > 0 ? home : homeAts < 0 ? away : 'PUSH',
      ou_margin: ou,
      ou_result: settle(ou, 'Over', 'Push', 'Under'),
      home_imp: hp !== null && ap !== null ? hp / (hp + ap) : null,
      away_imp: hp !== null && ap !== null ? ap / (hp + ap) : null,
      ml_hold: hp !== null && ap !== null ? hp + ap - 1 : null,
      spread_hold: hsp !== null && asp !== null ? hsp + asp - 1 : null,
      total_hold: op !== null && up !== null ? op + up - 1 : null,
      spread_bucket: NE.spreadBucket(favLine),
      total_bucket: NE.totalBucket(tl),
      stadium: v(r, 'stadium'),
      home_qb: v(r, 'home_qb_name'),
      away_qb: v(r, 'away_qb_name'),
      home_coach: v(r, 'home_coach'),
      away_coach: v(r, 'away_coach'),
    });
  }
  return out.sort((a, b) => (a.date === b.date ? (a.game_id < b.game_id ? -1 : 1) : a.date < b.date ? -1 : 1));
};

NE.SPREAD_BUCKETS = ['Pick–3', '3.5–6.5', '7–10', '10.5+'];
NE.TOTAL_BUCKETS = ['≤40', '40.5–43.5', '44–46.5', '47–49.5', '50+'];
NE.spreadBucket = (x) => (x === null ? null : x <= 3 ? 'Pick–3' : x <= 6.5 ? '3.5–6.5' : x <= 10 ? '7–10' : '10.5+');
NE.totalBucket = (t) => (t === null ? null : t <= 40 ? '≤40' : t <= 43.5 ? '40.5–43.5' : t <= 46.5 ? '44–46.5' : t <= 49.5 ? '47–49.5' : '50+');

NE.buildTeamGames = (games) => {
  const settle = (m, w, p, l) => (m === null ? null : m > 0 ? w : m < 0 ? l : p);
  const out = [];
  for (const g of games) {
    for (const side of ['home', 'away']) {
      const isHome = side === 'home';
      const team = isHome ? g.home_team : g.away_team;
      const pf = isHome ? g.home_score : g.away_score;
      const pa = isHome ? g.away_score : g.home_score;
      const line = g.spread_line === null ? null : isHome ? -g.spread_line : g.spread_line;
      const margin = pf - pa;
      out.push({
        g,
        game_id: g.game_id,
        season: g.season,
        week: g.week,
        phase: g.phase,
        date: g.date,
        team,
        opponent: isHome ? g.away_team : g.home_team,
        venue: g.neutral ? 'Neutral' : isHome ? 'Home' : 'Away',
        pts_for: pf,
        pts_against: pa,
        margin,
        su: settle(margin, 'W', 'T', 'L'),
        team_line: line,
        role: g.favorite === team ? 'Favorite' : g.underdog === team ? 'Underdog' : null,
        ats_margin: line === null ? null : margin + line,
        ats: line === null ? null : settle(margin + line, 'Cover', 'Push', 'No Cover'),
        ou_result: g.ou_result,
        total_line: g.total_line,
        total_pts: g.total_pts,
        ml: isHome ? g.home_ml : g.away_ml,
        imp: isHome ? g.home_imp : g.away_imp,
      });
    }
  }
  return out;
};

NE.games = NE.buildGames();
NE.teamGames = NE.buildTeamGames(NE.games);
NE.seasons = [...new Set(NE.games.map((g) => g.season))].sort((a, b) => a - b);
NE.teams = [...new Set(NE.games.flatMap((g) => [g.home_team, g.away_team]))].sort();
NE.latestSeason = NE.seasons[NE.seasons.length - 1];
NE.latestWeek = d3.max(NE.games.filter((g) => g.season === NE.latestSeason), (g) => g.week);

// ---------------------------------------------------------------------------
// Statistics
// ---------------------------------------------------------------------------
// Wilson score interval: a 95% range for a rate, given k successes in n tries.
NE.wilson = (k, n, z = 1.96) => {
  if (!n) return [null, null];
  const p = k / n;
  const d = 1 + (z * z) / n;
  const c = p + (z * z) / (2 * n);
  const m = z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n));
  return [(c - m) / d, (c + m) / d];
};
const count = (arr, f, val) => arr.reduce((s, r) => s + (r[f] === val ? 1 : 0), 0);
NE.count = count;
NE.mean = (arr, f) => {
  let s = 0;
  let k = 0;
  for (const r of arr) {
    const x = typeof f === 'function' ? f(r) : r[f];
    if (x !== null && x !== undefined && !Number.isNaN(x)) { s += x; k += 1; }
  }
  return k ? s / k : null;
};
NE.median = (arr, f) => {
  const xs = arr.map((r) => (typeof f === 'function' ? f(r) : r[f])).filter((x) => x !== null && x !== undefined).sort((a, b) => a - b);
  return xs.length ? d3.quantileSorted(xs, 0.5) : null;
};
// Straight-up record. Win % = wins / games (ties stay in the games).
NE.su = (arr, f = 'su') => {
  const w = count(arr, f, 'W');
  const l = count(arr, f, 'L');
  const t = count(arr, f, 'T');
  const n = w + l + t;
  const [lo, hi] = NE.wilson(w, n);
  return { w, l, t, n, pct: n ? w / n : null, lpct: n ? l / n : null, lo, hi, rec: `${w}-${l}${t ? `-${t}` : ''}`, lrec: `${l}-${w}${t ? `-${t}` : ''}` };
};
// Two-way market with pushes. Rate = wins / (wins + losses); pushes reported apart.
NE.graded = (arr, f, win, loss, push) => {
  const w = count(arr, f, win);
  const l = count(arr, f, loss);
  const p = count(arr, f, push);
  const dec = w + l;
  const [lo, hi] = NE.wilson(w, dec);
  const [llo, lhi] = NE.wilson(l, dec);
  return { w, l, p, dec, n: dec + p, pct: dec ? w / dec : null, lpct: dec ? l / dec : null, lo, hi, llo, lhi, ppct: dec + p ? p / (dec + p) : null, rec: `${w}-${l}-${p}`, lrec: `${l}-${w}-${p}` };
};
NE.ats = (arr, f = 'ats') => NE.graded(arr, f, 'Cover', 'No Cover', 'Push');
NE.ou = (arr, f = 'ou_result') => NE.graded(arr, f, 'Over', 'Under', 'Push');
// Is a rate's 95% range clear of 50%?
NE.clear = (r) => r && r.lo !== null && (r.lo > 0.5 || r.hi < 0.5);
NE.pearson = (xs, ys) => {
  const n = xs.length;
  if (n < 3) return null;
  const mx = d3.mean(xs);
  const my = d3.mean(ys);
  let sxy = 0;
  let sxx = 0;
  let syy = 0;
  for (let i = 0; i < n; i += 1) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
};

// ---------------------------------------------------------------------------
// Formatting
// ---------------------------------------------------------------------------
NE.f = {
  pct: (x) => (x === null || x === undefined ? '—' : d3.format('.1%')(x)),
  pct0: (x) => (x === null || x === undefined ? '—' : d3.format('.0%')(x)),
  n1: (x) => (x === null || x === undefined ? '—' : d3.format('.1f')(x)),
  n2: (x) => (x === null || x === undefined ? '—' : d3.format('.2f')(x)),
  int: (x) => (x === null || x === undefined ? '—' : d3.format(',')(x)),
  s1: (x) => (x === null || x === undefined ? '—' : `${x > 0 ? '+' : x < 0 ? '−' : ''}${d3.format('.1f')(Math.abs(x))}`),
  line: (x) => (x === null || x === undefined ? '—' : x === 0 ? 'PK' : `${x > 0 ? '+' : '−'}${d3.format('~g')(Math.abs(x))}`),
  odds: (x) => (x === null || x === undefined ? '—' : `${x > 0 ? '+' : '−'}${Math.abs(Math.round(x))}`),
  date: (s) => (s ? d3.utcFormat('%b %-d, %Y')(new Date(`${s}T00:00:00Z`)) : '—'),
  pp: (x) => (x === null || x === undefined ? '—' : `${x > 0 ? '+' : x < 0 ? '−' : ''}${d3.format('.1f')(Math.abs(x) * 100)} pts`),
  ci: (r) => (r && r.lo !== null ? `${d3.format('.0%')(r.lo)}–${d3.format('.0%')(r.hi)}` : '—'),
  moe: (r) => (r && r.lo !== null ? `± ${d3.format('.1f')(((r.hi - r.lo) / 2) * 100)} pts` : ''),
};
NE.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------------------------------------------------------------------------
// State: filters, tabs and selections. Kept in the URL hash so a view can be bookmarked.
// ---------------------------------------------------------------------------
NE.DEFAULTS = {
  tab: 'story',
  s0: NE.seasons[0],
  s1: NE.latestSeason,
  phase: 'All',
  team: '',
  neutral: true,
  // page-level
  pteam: 'KC',
  pteam2: 'BUF',
  tmode: 'profile',
  bet: 'ats',
  metric: 'avg_total',
  split: 'none',
  heat: 'avg_total',
  funnel: 'cover',
  rank: 'cover',
  persist: 'cover',
  gx_team: '',
  gx_opp: '',
  gx_venue: '',
  gx_role: '',
  gx_ats: '',
  gx_ou: '',
  gx_spread: '',
  gx_total: '',
  gx_season: '',
  gx_week: '',
  gx_q: '',
  gx_sort: 'date',
  gx_dir: 'desc',
  gx_page: 0,
  game: '',
};
NE.S = { ...NE.DEFAULTS };
const GLOBAL_KEYS = ['s0', 's1', 'phase', 'team', 'neutral'];

NE.readHash = () => {
  const h = location.hash.replace(/^#/, '');
  if (!h) return;
  if (/^[a-z]+$/.test(h)) { NE.S.tab = h; return; }
  try {
    const params = new URLSearchParams(h);
    for (const [k, val] of params) {
      if (!(k in NE.DEFAULTS)) continue;
      const d = NE.DEFAULTS[k];
      NE.S[k] = typeof d === 'number' ? Number(val) : typeof d === 'boolean' ? val === '1' : val;
    }
  } catch (e) { /* ignore a malformed hash */ }
};
NE.writeHash = () => {
  const p = new URLSearchParams();
  for (const k of Object.keys(NE.DEFAULTS)) {
    if (NE.S[k] !== NE.DEFAULTS[k] || k === 'tab') p.set(k, typeof NE.S[k] === 'boolean' ? (NE.S[k] ? '1' : '0') : NE.S[k]);
  }
  try { history.replaceState(null, '', `#${p.toString()}`); } catch (e) { /* sandboxed frames may refuse */ }
};

NE.listeners = [];
NE.set = (patch) => {
  Object.assign(NE.S, patch);
  // Keep the season range valid: moving one end past the other drags it along.
  if (NE.S.s0 > NE.S.s1) { if ('s0' in patch) NE.S.s1 = NE.S.s0; else NE.S.s0 = NE.S.s1; }
  NE.writeHash();
  for (const fn of NE.listeners) fn(patch);
};
NE.resetFilters = () => NE.set(Object.fromEntries(GLOBAL_KEYS.map((k) => [k, NE.DEFAULTS[k]])));
NE.filtersAreDefault = () => GLOBAL_KEYS.every((k) => NE.S[k] === NE.DEFAULTS[k]);

// Filtered data, cached on the global filter values.
let cacheKey = '';
let cache = null;
NE.data = () => {
  const S = NE.S;
  const key = GLOBAL_KEYS.map((k) => S[k]).join('|');
  if (key === cacheKey && cache) return cache;
  const keep = (g) => g.season >= S.s0 && g.season <= S.s1 && (S.phase === 'All' || g.phase === S.phase) && (S.neutral || !g.neutral);
  const games = NE.games.filter((g) => keep(g) && (!S.team || g.home_team === S.team || g.away_team === S.team));
  const scopeGames = NE.games.filter(keep);
  const ids = new Set(games.map((g) => g.game_id));
  const scopeIds = new Set(scopeGames.map((g) => g.game_id));
  cache = {
    games,
    teamGames: NE.teamGames.filter((t) => ids.has(t.game_id)),
    // the same filters without the team filter, for team pages and rankings
    scopeGames,
    scopeTeamGames: NE.teamGames.filter((t) => scopeIds.has(t.game_id)),
  };
  cacheKey = key;
  return cache;
};
// Trend axis: seasons normally, weeks when one season is in view.
NE.trendKey = () => (NE.S.s0 === NE.S.s1 ? 'week' : 'season');

// ---------------------------------------------------------------------------
// Aggregations shared by several views
// ---------------------------------------------------------------------------
NE.groupBy = (arr, key) => d3.groups(arr, typeof key === 'function' ? key : (r) => r[key]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));

// League metrics by period, each with the counts needed for a 95% range.
NE.METRICS = {
  avg_total: { label: 'Combined points per game', fmt: 'n1', kind: 'mean', calc: (g) => ({ value: NE.mean(g, 'total_pts'), sd: d3.deviation(g, (r) => r.total_pts), n: g.length }) },
  avg_total_line: { label: 'Closing total', fmt: 'n1', kind: 'mean', calc: (g) => ({ value: NE.mean(g, 'total_line'), sd: d3.deviation(g, (r) => r.total_line), n: g.length }) },
  avg_margin: { label: 'Winning margin', fmt: 'n1', kind: 'mean', calc: (g) => { const d = g.filter((r) => r.result !== 0); return { value: NE.mean(d, 'abs_margin'), sd: d3.deviation(d, (r) => r.abs_margin), n: d.length }; } },
  avg_fav_line: { label: 'Points laid by the favorite', fmt: 'n1', kind: 'mean', calc: (g) => ({ value: NE.mean(g, 'fav_line'), sd: d3.deviation(g, (r) => r.fav_line), n: g.length }) },
  home_win: { label: 'Home win %', fmt: 'pct', kind: 'rate', calc: (g) => { const r = NE.su(g.filter((x) => !x.neutral).map((x) => ({ su: x.result > 0 ? 'W' : x.result < 0 ? 'L' : 'T' }))); return { value: r.pct, lo: r.lo, hi: r.hi, n: r.n }; } },
  fav_win: { label: 'Favorite win %', fmt: 'pct', kind: 'rate', calc: (g) => { const r = NE.su(g, 'fav_su'); return { value: r.pct, lo: r.lo, hi: r.hi, n: r.n }; } },
  fav_cover: { label: 'Favorite cover %', fmt: 'pct', kind: 'rate', calc: (g) => { const r = NE.ats(g, 'fav_ats'); return { value: r.pct, lo: r.lo, hi: r.hi, n: r.dec }; } },
  home_cover: { label: 'Home cover %', fmt: 'pct', kind: 'rate', calc: (g) => { const r = NE.ats(g, 'home_ats'); return { value: r.pct, lo: r.lo, hi: r.hi, n: r.dec }; } },
  over: { label: 'Over %', fmt: 'pct', kind: 'rate', calc: (g) => { const r = NE.ou(g); return { value: r.pct, lo: r.lo, hi: r.hi, n: r.dec }; } },
  spread_mae: { label: 'Spread miss (points)', fmt: 'n1', kind: 'mean', calc: (g) => { const v = g.filter((r) => r.home_ats_margin !== null).map((r) => Math.abs(r.home_ats_margin)); return { value: d3.mean(v) ?? null, sd: d3.deviation(v), n: v.length }; } },
  total_mae: { label: 'Total miss (points)', fmt: 'n1', kind: 'mean', calc: (g) => { const v = g.filter((r) => r.ou_margin !== null).map((r) => Math.abs(r.ou_margin)); return { value: d3.mean(v) ?? null, sd: d3.deviation(v), n: v.length }; } },
  ml_hold: { label: 'Moneyline margin', fmt: 'pct', kind: 'plain', calc: (g) => ({ value: NE.mean(g, 'ml_hold'), n: g.length }) },
};
// Adds a 95% range to a mean: ± 1.96 standard errors.
NE.metricPoint = (key, g) => {
  const m = NE.METRICS[key];
  const r = m.calc(g);
  if (m.kind === 'mean' && r.sd && r.n > 1) { const se = r.sd / Math.sqrt(r.n); r.lo = r.value - 1.96 * se; r.hi = r.value + 1.96 * se; }
  return r;
};
// Splits that make sense for a metric: the same metric for two groups.
NE.SPLITS = {
  none: { label: 'No split', groups: null },
  phase: { label: 'Regular season vs. playoffs', groups: [['Regular season', (g) => g.phase === 'REG'], ['Playoffs', (g) => g.phase === 'POST']] },
  div: { label: 'Big vs. small spreads', groups: [['Spread 7 or more', (g) => g.fav_line !== null && g.fav_line >= 7], ['Spread under 7', (g) => g.fav_line !== null && g.fav_line < 7]] },
  site: { label: 'Neutral vs. home sites', groups: [['Home sites', (g) => !g.neutral], ['Neutral sites', (g) => g.neutral]] },
};

NE.teamSummary = (rows) => {
  const su = NE.su(rows);
  const ats = NE.ats(rows);
  const ou = NE.ou(rows);
  const part = (f) => { const v = rows.filter(f); return { n: v.length, su: NE.su(v), ats: NE.ats(v) }; };
  return {
    n: rows.length,
    su,
    ats,
    ou,
    ppg: NE.mean(rows, 'pts_for'),
    papg: NE.mean(rows, 'pts_against'),
    diff: NE.mean(rows, 'margin'),
    atsMargin: NE.mean(rows, 'ats_margin'),
    line: NE.mean(rows, 'team_line'),
    totalLine: NE.mean(rows, 'total_line'),
    combined: NE.mean(rows, 'total_pts'),
    expWins: d3.sum(rows, (r) => r.imp ?? 0),
    home: part((r) => r.venue === 'Home'),
    away: part((r) => r.venue === 'Away'),
    neutral: part((r) => r.venue === 'Neutral'),
    fav: part((r) => r.role === 'Favorite'),
    dog: part((r) => r.role === 'Underdog'),
  };
};
NE.teamTable = (teamGames) => NE.groupBy(teamGames, 'team').map(([team, rows]) => {
  const s = NE.teamSummary(rows);
  return { team, ...s, winsOverExp: s.su.w + 0.5 * s.su.t - s.expWins };
});

// NFL EDGE: chart library (d3). Every chart sizes itself from its box, shows a tooltip on
// hover, and can take an onClick to drive the rest of the dashboard.
'use strict';

(() => {
  const NE = window.NE;
  const C = (NE.charts = {});
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  C.col = {
    blue: () => cssVar('--blue'),
    orange: () => cssVar('--orange'),
    teal: () => cssVar('--teal'),
    violet: () => cssVar('--violet'),
    good: () => cssVar('--good'),
    bad: () => cssVar('--bad'),
    muted: () => cssVar('--mark-muted'),
    ref: () => cssVar('--ref'),
  };
  C.series = () => [C.col.blue(), C.col.orange(), C.col.teal(), C.col.violet()];

  // ---- tooltip --------------------------------------------------------------
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.hidden = true;
  document.body.append(tip);
  C.tip = (event, title, lines) => {
    tip.replaceChildren();
    const h = document.createElement('div');
    h.className = 'tip-h';
    h.textContent = title;
    tip.append(h);
    for (const ln of lines) {
      const row = document.createElement('div');
      row.className = 'tip-r';
      if (ln.color) { const s = document.createElement('i'); s.style.background = ln.color; row.append(s); }
      const a = document.createElement('span');
      a.textContent = ln.label;
      const b = document.createElement('b');
      b.textContent = ln.value;
      row.append(a, b);
      tip.append(row);
    }
    if (lines.hint) { const p = document.createElement('div'); p.className = 'tip-hint'; p.textContent = lines.hint; tip.append(p); }
    tip.hidden = false;
    const w = tip.offsetWidth;
    const h2 = tip.offsetHeight;
    let x = event.clientX + 14;
    let y = event.clientY - h2 - 10;
    if (x + w > window.innerWidth - 8) x = event.clientX - w - 14;
    if (y < 8) y = event.clientY + 16;
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${y}px`;
  };
  C.hide = () => { tip.hidden = true; };

  // ---- shared pieces -----------------------------------------------------------
  const svgFor = (el, H) => {
    el.replaceChildren();
    const W = Math.max(280, Math.floor(el.clientWidth || 600));
    const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', '100%').attr('role', 'img');
    return { svg, W, H };
  };
  const measure = (svg, strings, cls = 'tick') => {
    const g = svg.append('g');
    let w = 0;
    for (const s of strings) w = Math.max(w, g.append('text').attr('class', cls).text(s).node().getComputedTextLength());
    g.remove();
    return w;
  };
  // Legend across the top; returns its height.
  const legend = (svg, items, W) => {
    if (items.length < 2) return 0;
    const g = svg.append('g');
    let x = 0;
    let y = 11;
    for (const it of items) {
      const n = g.append('g');
      if (it.band) n.append('rect').attr('width', 14).attr('height', 9).attr('y', -8).attr('fill', it.color).attr('opacity', 0.25);
      else if (it.line) n.append('line').attr('x1', 0).attr('x2', 14).attr('y1', -4).attr('y2', -4).attr('stroke', it.color).attr('stroke-width', it.dash ? 1.2 : 2).attr('stroke-dasharray', it.dash ? '4 3' : null);
      else n.append('rect').attr('width', 10).attr('height', 10).attr('rx', 2).attr('y', -9).attr('fill', it.color);
      const t = n.append('text').attr('x', it.band || it.line ? 19 : 15).attr('class', 'legend').text(it.label);
      const w = (it.band || it.line ? 19 : 15) + t.node().getComputedTextLength() + 16;
      if (x + w > W && x > 0) { x = 0; y += 17; }
      n.attr('transform', `translate(${x},${y})`);
      x += w;
    }
    return y + 9;
  };
  const yGrid = (svg, y, fmt, L, R, ticks = 5) => {
    const t = y.ticks(ticks);
    const g = svg.append('g');
    g.selectAll('line').data(t).join('line').attr('class', 'grid').attr('x1', L).attr('x2', R).attr('y1', y).attr('y2', y);
    g.selectAll('text').data(t).join('text').attr('class', 'tick').attr('x', L - 8).attr('y', y).attr('dy', '0.32em').attr('text-anchor', 'end').text(fmt);
  };
  const xCats = (svg, cats, pos, yPos, W) => {
    const widest = measure(svg, cats.map(String));
    const every = Math.max(1, Math.ceil((widest + 10) / (W / Math.max(1, cats.length))));
    svg.append('g').selectAll('text').data(cats.filter((_, i) => i % every === 0)).join('text')
      .attr('class', 'tick').attr('x', pos).attr('y', yPos).attr('text-anchor', 'middle').text((d) => d);
  };
  const refLine = (svg, y, v, L, R, label) => {
    if (v === null || v === undefined) return;
    svg.append('line').attr('class', 'ref').attr('x1', L).attr('x2', R).attr('y1', y(v)).attr('y2', y(v));
    if (label) svg.append('text').attr('class', 'ref-t').attr('x', R).attr('y', y(v) - 4).attr('text-anchor', 'end').text(label);
  };
  const axisTitle = (svg, text, x, y, rotate) => {
    const t = svg.append('text').attr('class', 'axis-t').attr('text-anchor', 'middle').text(text);
    if (rotate) t.attr('transform', `translate(${x},${y}) rotate(-90)`); else t.attr('x', x).attr('y', y);
  };
  C.empty = (el, text = 'No games match these filters.') => {
    el.replaceChildren();
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = text;
    el.append(p);
  };
  const valOf = (kind) => (kind === 'pct' ? NE.f.pct : NE.f.n1);

  // ---- line chart, optional 95% band ------------------------------------------------
  // o: { cats, series:[{name, color, values, lo?, hi?, n?}], kind:'pct'|'num', ref, xLabel, onClick(i), h, hint }
  C.line = (el, o) => {
    if (!o.cats.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, o.h || 270);
    const items = o.series.map((s) => ({ label: s.name, color: s.color, line: true }));
    if (o.series.some((s) => s.lo)) items.push({ label: '95% range', color: o.series[0].color, band: true });
    const top = legend(svg, items, W) + 12;
    const all = o.series.flatMap((s) => [...s.values, ...(s.lo || []), ...(s.hi || [])]).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
    if (o.ref !== undefined && o.ref !== null) all.push(o.ref);
    const [a, b] = d3.extent(all);
    const pad = (b - a) * 0.08 || Math.abs(b) * 0.1 || 1;
    const y = d3.scaleLinear([a - pad, b + pad], [H - 28, top]).nice(5);
    const yf = y.tickFormat(5, o.kind === 'pct' ? '%' : '');
    const L = measure(svg, y.ticks(5).map(yf)) + 14;
    const R = W - 10;
    const cats = o.cats.map(String);
    const x = d3.scalePoint(cats, [L + 12, R - 10]);
    yGrid(svg, y, yf, L, R);
    refLine(svg, y, o.ref, L, R, o.refLabel);
    xCats(svg, cats, (d) => x(d), H - 8, W);
    const ok = (v) => v !== null && v !== undefined && !Number.isNaN(v);
    for (const s of o.series) {
      if (s.lo) {
        const area = d3.area().defined((_, i) => ok(s.lo[i]) && ok(s.hi[i])).x((_, i) => x(cats[i])).y0((_, i) => y(s.lo[i])).y1((_, i) => y(s.hi[i]));
        svg.append('path').datum(cats).attr('d', area).attr('fill', s.color).attr('opacity', 0.16);
      }
    }
    for (const s of o.series) {
      const line = d3.line().defined((_, i) => ok(s.values[i])).x((_, i) => x(cats[i])).y((_, i) => y(s.values[i]));
      svg.append('path').datum(cats).attr('d', line).attr('class', 'line').attr('stroke', s.color).attr('stroke-dasharray', s.dash ? '5 4' : null);
      svg.append('g').selectAll('circle').data(cats.map((c, i) => i).filter((i) => ok(s.values[i]))).join('circle')
        .attr('class', 'dot').attr('cx', (i) => x(cats[i])).attr('cy', (i) => y(s.values[i])).attr('r', cats.length > 25 ? 2.5 : 3.6).attr('fill', s.color);
    }
    const step = cats.length > 1 ? x.step() : W - L;
    const rule = svg.append('line').attr('class', 'hover-rule').attr('y1', top).attr('y2', H - 28).attr('opacity', 0);
    const fv = valOf(o.kind);
    svg.append('g').selectAll('rect').data(cats).join('rect')
      .attr('x', (d) => x(d) - step / 2).attr('width', step).attr('y', top).attr('height', H - 28 - top).attr('fill', 'transparent')
      .attr('class', o.onClick ? 'hit clickable' : 'hit')
      .on('mousemove', (event, d) => {
        const i = cats.indexOf(d);
        rule.attr('x1', x(d)).attr('x2', x(d)).attr('opacity', 1);
        const lines = o.series.map((s) => ({ color: o.series.length > 1 ? s.color : null, label: s.name, value: `${fv(s.values[i])}${s.lo && ok(s.lo[i]) ? `  (${fv(s.lo[i])}–${fv(s.hi[i])})` : ''}` }));
        const n = o.series[0].n;
        if (n) lines.push({ label: 'Games', value: NE.f.int(n[i]) });
        if (o.hint) lines.hint = o.hint;
        C.tip(event, `${o.xLabel ? `${o.xLabel} ` : ''}${d}`, lines);
      })
      .on('mouseleave', () => { rule.attr('opacity', 0); C.hide(); })
      .on('click', (event, d) => { if (o.onClick) { C.hide(); o.onClick(cats.indexOf(d)); } });
  };

  // ---- grouped bars with optional 95% whiskers --------------------------------------
  // o: { cats, series:[{name, color, values, lo?, hi?, n?, extra?}], kind, ref, onClick(ci, si), labels, h, hint, xLabel }
  C.bars = (el, o) => {
    if (!o.cats.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, o.h || 270);
    const items = o.series.map((s) => ({ label: s.name, color: s.color }));
    const top = legend(svg, items, W) + 16;
    const all = o.series.flatMap((s) => [...s.values, ...(s.hi || [])]).filter((v) => v !== null && v !== undefined);
    const hi = Math.max(d3.max(all) ?? 0, o.ref ?? 0);
    const lo = Math.min(0, d3.min(o.series.flatMap((s) => s.values).filter((v) => v !== null)) ?? 0);
    const y = d3.scaleLinear([lo, hi * 1.06 || 1], [H - 28, top]).nice(5);
    const yf = y.tickFormat(5, o.kind === 'pct' ? '%' : '');
    const L = measure(svg, y.ticks(5).map(yf)) + 14;
    const R = W - 8;
    const cats = o.cats.map(String);
    const x = d3.scaleBand(cats, [L + 4, R]).paddingInner(0.25).paddingOuter(0.1);
    const inner = d3.scaleBand(o.series.map((_, i) => i), [0, x.bandwidth()]).padding(0.1);
    const bw = Math.min(inner.bandwidth(), 34);
    yGrid(svg, y, yf, L, R);
    xCats(svg, cats, (d) => x(d) + x.bandwidth() / 2, H - 8, W);
    const fv = valOf(o.kind);
    o.series.forEach((s, si) => {
      const g = svg.append('g');
      const idx = cats.map((_, i) => i).filter((i) => s.values[i] !== null && s.values[i] !== undefined);
      const cx = (i) => x(cats[i]) + inner(si) + inner.bandwidth() / 2;
      g.selectAll('rect').data(idx).join('rect')
        .attr('x', (i) => cx(i) - bw / 2).attr('width', bw)
        .attr('y', (i) => Math.min(y(s.values[i]), y(0))).attr('height', (i) => Math.abs(y(0) - y(s.values[i])))
        .attr('rx', 3).attr('fill', (i) => (s.colors ? s.colors[i] : s.color)).attr('class', o.onClick ? 'clickable' : null)
        .on('mousemove', (event, i) => {
          const lines = [{ color: o.series.length > 1 ? s.color : null, label: s.name, value: fv(s.values[i]) }];
          if (s.lo && s.lo[i] !== null) lines.push({ label: '95% range', value: `${fv(s.lo[i])}–${fv(s.hi[i])}` });
          if (s.n) lines.push({ label: 'Games', value: NE.f.int(s.n[i]) });
          for (const e of s.extra ? s.extra(i) : []) lines.push(e);
          if (o.hint) lines.hint = o.hint;
          C.tip(event, `${o.xLabel ? `${o.xLabel} ` : ''}${cats[i]}`, lines);
        })
        .on('mouseleave', C.hide)
        .on('click', (event, i) => { if (o.onClick) { C.hide(); o.onClick(i, si); } });
      if (s.lo) {
        const w = g.append('g').attr('class', 'whisker');
        for (const i of idx) {
          if (s.lo[i] === null || s.lo[i] === undefined) continue;
          w.append('line').attr('x1', cx(i)).attr('x2', cx(i)).attr('y1', y(s.lo[i])).attr('y2', y(s.hi[i]));
          w.append('line').attr('x1', cx(i) - 4).attr('x2', cx(i) + 4).attr('y1', y(s.lo[i])).attr('y2', y(s.lo[i]));
          w.append('line').attr('x1', cx(i) - 4).attr('x2', cx(i) + 4).attr('y1', y(s.hi[i])).attr('y2', y(s.hi[i]));
        }
      }
      if (o.labels !== false && cats.length * o.series.length <= 14 && bw >= 18 && !s.lo) {
        g.selectAll('text').data(idx).join('text').attr('class', 'bar-label').attr('x', cx).attr('y', (i) => y(Math.max(0, s.values[i])) - 5)
          .attr('text-anchor', 'middle').text((i) => (o.kind === 'pct' ? d3.format('.0%')(s.values[i]) : d3.format('.1f')(s.values[i])));
      }
    });
    refLine(svg, y, o.ref, L, R, o.refLabel);
  };

  // ---- 100% stacked outcomes ----------------------------------------------------------
  // o: { cats, parts:[{name,color,values}], onClick(i), xLabel, h }
  C.stack = (el, o) => {
    if (!o.cats.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, o.h || 270);
    const top = legend(svg, o.parts.map((p) => ({ label: p.name, color: p.color })), W) + 12;
    const y = d3.scaleLinear([0, 1], [H - 28, top]);
    const L = measure(svg, ['100%']) + 14;
    const R = W - 8;
    const cats = o.cats.map(String);
    const x = d3.scaleBand(cats, [L + 4, R]).paddingInner(0.28).paddingOuter(0.1);
    const bw = Math.min(x.bandwidth(), 42);
    yGrid(svg, y, d3.format('.0%'), L, R);
    xCats(svg, cats, (d) => x(d) + x.bandwidth() / 2, H - 8, W);
    cats.forEach((c, i) => {
      const tot = d3.sum(o.parts, (p) => p.values[i]) || 1;
      let acc = 0;
      for (const p of o.parts) {
        const v = p.values[i] / tot;
        svg.append('rect').attr('x', x(c) + (x.bandwidth() - bw) / 2).attr('width', bw).attr('y', y(acc + v)).attr('height', Math.max(0, y(acc) - y(acc + v) - (v > 0 ? 1.5 : 0)))
          .attr('fill', p.color).attr('class', o.onClick ? 'clickable' : null)
          .on('mousemove', (event) => {
            const lines = o.parts.map((q) => ({ color: q.color, label: q.name, value: `${q.values[i]} (${d3.format('.0%')(q.values[i] / tot)})` }));
            if (o.hint) lines.hint = o.hint;
            C.tip(event, `${o.xLabel ? `${o.xLabel} ` : ''}${c}`, lines);
          })
          .on('mouseleave', C.hide)
          .on('click', () => { if (o.onClick) { C.hide(); o.onClick(i); } });
        acc += v;
      }
    });
    refLine(svg, y, 0.5, L, R);
  };

  // ---- histogram over numeric values ------------------------------------------------------
  // o: { values:[numbers], step, highlight:[...], xLabel, color, h, onClick(value) }
  C.hist = (el, o) => {
    const vals = o.values.filter((v) => v !== null && v !== undefined);
    if (!vals.length) return C.empty(el);
    const step = o.step || 1;
    const counts = d3.rollups(vals, (v) => v.length, (v) => Math.floor(v / step) * step).sort((a, b) => a[0] - b[0]);
    const { svg, W, H } = svgFor(el, o.h || 240);
    const ymax = d3.max(counts, (c) => c[1]);
    const y = d3.scaleLinear([0, ymax * 1.08], [H - 40, 10]).nice(5);
    const L = measure(svg, y.ticks(5).map(d3.format('~f'))) + 14;
    const R = W - 8;
    const [a, b] = d3.extent(counts, (c) => c[0]);
    const x = d3.scaleLinear([a - step / 2, b + step / 2], [L + 4, R]);
    const bw = Math.max(1.2, x(a + step) - x(a) - 1.5);
    yGrid(svg, y, d3.format('~f'), L, R);
    svg.append('g').selectAll('text').data(x.ticks(Math.min(12, Math.floor(W / 64)))).join('text').attr('class', 'tick').attr('x', x).attr('y', H - 24).attr('text-anchor', 'middle').text(d3.format('~f'));
    axisTitle(svg, o.xLabel, (L + R) / 2, H - 4);
    const hl = new Set(o.highlight || []);
    svg.append('g').selectAll('rect').data(counts).join('rect')
      .attr('x', (c) => x(c[0]) - bw / 2).attr('width', bw).attr('y', (c) => y(c[1])).attr('height', (c) => y(0) - y(c[1]))
      .attr('rx', Math.min(2, bw / 2)).attr('fill', (c) => (hl.has(c[0]) ? C.col.orange() : o.color || C.col.blue())).attr('class', o.onClick ? 'clickable' : null)
      .on('mousemove', (event, c) => {
        const lines = [{ label: 'Games', value: NE.f.int(c[1]) }, { label: 'Share', value: d3.format('.1%')(c[1] / vals.length) }];
        if (o.onClick) lines.hint = 'Click to list these games';
        C.tip(event, `${o.xLabel}: ${d3.format('~f')(c[0])}${step !== 1 && step !== 0.5 ? `–${d3.format('~f')(c[0] + step)}` : ''}`, lines);
      })
      .on('mouseleave', C.hide)
      .on('click', (event, c) => { if (o.onClick) { C.hide(); o.onClick(c[0]); } });
  };

  // ---- scatter -----------------------------------------------------------------------
  // o: { points:[{x,y,group,label,id}], groups:[{key,name,color}], xLabel, yLabel, diag, zero, fit, onClick(p), h, xFmt, yFmt }
  C.scatter = (el, o) => {
    if (!o.points.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, o.h || 340);
    const counts = d3.rollup(o.points, (v) => v.length, (p) => p.group);
    const items = o.groups.map((g) => ({ label: `${g.name} (${NE.f.int(counts.get(g.key) || 0)})`, color: g.color }));
    if (o.fit) items.push({ label: 'Trend line', color: C.col.ref(), line: true });
    if (o.diag) items.push({ label: o.diagLabel || 'Line = result', color: C.col.ref(), line: true, dash: true });
    const top = legend(svg, items, W) + 10;
    const xs = d3.extent(o.points, (p) => p.x);
    const ys = d3.extent(o.points, (p) => p.y);
    let xd = xs;
    let yd = ys;
    if (o.xDomain) xd = o.xDomain;
    if (o.yDomain) yd = o.yDomain;
    const y = d3.scaleLinear(yd, [H - 42, top]).nice();
    const yFmt = o.yFmt || d3.format('~f');
    const xFmt = o.xFmt || d3.format('~f');
    const L = measure(svg, y.ticks(6).map(yFmt)) + 30;
    const R = W - 10;
    const x = d3.scaleLinear(xd, [L, R]).nice();
    yGrid(svg, y, yFmt, L, R, 6);
    svg.append('g').selectAll('text').data(x.ticks(Math.min(10, Math.floor(W / 70)))).join('text').attr('class', 'tick').attr('x', x).attr('y', H - 24).attr('text-anchor', 'middle').text(xFmt);
    axisTitle(svg, o.xLabel, (L + R) / 2, H - 4);
    axisTitle(svg, o.yLabel, 11, (top + H - 42) / 2, true);
    if (o.zero) {
      svg.append('line').attr('class', 'axis').attr('x1', x(0)).attr('x2', x(0)).attr('y1', top).attr('y2', H - 42);
      svg.append('line').attr('class', 'axis').attr('x1', L).attr('x2', R).attr('y1', y(0)).attr('y2', y(0));
    }
    if (o.hline !== undefined) svg.append('line').attr('class', 'ref').attr('x1', L).attr('x2', R).attr('y1', y(o.hline)).attr('y2', y(o.hline));
    if (o.vline !== undefined) svg.append('line').attr('class', 'ref').attr('x1', x(o.vline)).attr('x2', x(o.vline)).attr('y1', top).attr('y2', H - 42);
    if (o.diag) {
      const d0 = Math.max(x.domain()[0], y.domain()[0]);
      const d1 = Math.min(x.domain()[1], y.domain()[1]);
      svg.append('line').attr('class', 'ref').attr('x1', x(d0)).attr('y1', y(d0)).attr('x2', x(d1)).attr('y2', y(d1));
    }
    const colorOf = new Map(o.groups.map((g) => [g.key, g.color]));
    const r = o.points.length > 400 ? 3 : 5;
    svg.append('g').selectAll('circle').data(o.points).join('circle')
      .attr('cx', (p) => x(p.x)).attr('cy', (p) => y(p.y)).attr('r', r)
      .attr('fill', (p) => colorOf.get(p.group) || C.col.muted()).attr('fill-opacity', o.points.length > 400 ? 0.55 : 0.85)
      .attr('stroke', 'var(--panel)').attr('stroke-width', o.points.length > 400 ? 0.5 : 1)
      .attr('class', o.onClick ? 'clickable' : null)
      .on('mousemove', (event, p) => {
        const lines = [{ label: o.xLabel, value: xFmt(p.x) }, { label: o.yLabel, value: yFmt(p.y) }, ...(p.lines || [])];
        if (o.onClick) lines.hint = o.clickHint || 'Click for details';
        C.tip(event, p.label, lines);
      })
      .on('mouseleave', C.hide)
      .on('click', (event, p) => { if (o.onClick) { C.hide(); o.onClick(p); } });
    if (o.fit && o.points.length > 2) {
      const reg = d3.mean(o.points, (p) => p.x);
      const mY = d3.mean(o.points, (p) => p.y);
      const sxy = d3.sum(o.points, (p) => (p.x - reg) * (p.y - mY));
      const sxx = d3.sum(o.points, (p) => (p.x - reg) ** 2);
      const slope = sxx ? sxy / sxx : 0;
      const [a, b] = x.domain();
      svg.append('line').attr('class', 'fit').attr('x1', x(a)).attr('x2', x(b)).attr('y1', y(mY + slope * (a - reg))).attr('y2', y(mY + slope * (b - reg)));
    }
  };

  // ---- horizontal bars around a center, with 95% whiskers (team rankings) ----------------
  // o: { rows:[{label, value, lo, hi, n, lines}], center, kind, onClick(label), selected }
  C.hbars = (el, o) => {
    if (!o.rows.length) return C.empty(el);
    const rowH = 19;
    const top = 6;
    const H = top + o.rows.length * rowH + 30;
    const { svg, W } = svgFor(el, H);
    const fmt = o.kind === 'pct' ? d3.format('.0%') : d3.format('+.1f');
    const ext = d3.extent([...o.rows.flatMap((r) => [r.lo ?? r.value, r.hi ?? r.value]), o.center]);
    const span = Math.max(o.center - ext[0], ext[1] - o.center) * 1.05 || 0.1;
    const L = measure(svg, o.rows.map((r) => r.label)) + 12;
    const R = W - 10;
    const x = d3.scaleLinear([o.center - span, o.center + span], [L, R]);
    const y = d3.scaleBand(o.rows.map((r) => r.label), [top, top + o.rows.length * rowH]).padding(0.24);
    const ticks = x.ticks(6);
    svg.append('g').selectAll('line').data(ticks).join('line').attr('class', 'grid').attr('x1', x).attr('x2', x).attr('y1', top).attr('y2', H - 26);
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'tick').attr('x', x).attr('y', H - 9).attr('text-anchor', 'middle').text(fmt);
    svg.append('g').selectAll('text').data(o.rows).join('text').attr('class', (r) => (r.label === o.selected ? 'tick sel' : 'tick'))
      .attr('x', L - 8).attr('y', (r) => y(r.label) + y.bandwidth() / 2).attr('dy', '0.32em').attr('text-anchor', 'end').text((r) => r.label);
    const good = C.col.good();
    const bad = C.col.bad();
    const muted = C.col.muted();
    const fill = (r) => {
      const clear = r.lo !== undefined && r.lo !== null && (r.lo > o.center || r.hi < o.center);
      if (o.noise && !clear) return muted;
      return r.value >= o.center ? good : bad;
    };
    svg.append('g').selectAll('rect').data(o.rows).join('rect')
      .attr('x', (r) => Math.min(x(r.value), x(o.center))).attr('width', (r) => Math.max(1, Math.abs(x(r.value) - x(o.center))))
      .attr('y', (r) => y(r.label)).attr('height', y.bandwidth()).attr('rx', 2).attr('fill', fill)
      .attr('stroke', (r) => (r.label === o.selected ? 'var(--text)' : null)).attr('stroke-width', 1.5)
      .attr('class', o.onClick ? 'clickable' : null)
      .on('mousemove', (event, r) => {
        const lines = [{ label: o.valueLabel || 'Value', value: o.kind === 'pct' ? NE.f.pct(r.value) : NE.f.s1(r.value) }];
        if (r.lo !== undefined && r.lo !== null) lines.push({ label: '95% range', value: `${NE.f.pct(r.lo)}–${NE.f.pct(r.hi)}` });
        for (const ln of r.lines || []) lines.push(ln);
        if (o.onClick) lines.hint = 'Click to open this team';
        C.tip(event, r.label, lines);
      })
      .on('mouseleave', C.hide)
      .on('click', (event, r) => { if (o.onClick) { C.hide(); o.onClick(r.label); } });
    if (o.rows[0].lo !== undefined) {
      const w = svg.append('g').attr('class', 'whisker');
      for (const r of o.rows) {
        if (r.lo === null) continue;
        const cy = y(r.label) + y.bandwidth() / 2;
        w.append('line').attr('x1', x(r.lo)).attr('x2', x(r.hi)).attr('y1', cy).attr('y2', cy);
      }
    }
    svg.append('line').attr('class', 'ref').attr('x1', x(o.center)).attr('x2', x(o.center)).attr('y1', top - 4).attr('y2', H - 26);
  };

  // ---- funnel plot: rate against sample size, with the band chance alone would give ------
  // o: { points:[{label, n, p, k}], p0, yLabel, onClick(label), selected }
  C.funnel = (el, o) => {
    if (!o.points.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, o.h || 380);
    const top = legend(svg, [
      { label: 'Inside the chance band', color: C.col.muted() },
      { label: 'Outside it, above', color: C.col.good() },
      { label: 'Outside it, below', color: C.col.bad() },
      { label: '95% band for a 50/50 coin', color: C.col.blue(), band: true },
    ], W) + 10;
    const nMax = d3.max(o.points, (p) => p.n) * 1.05;
    const nMin = Math.max(4, d3.min(o.points, (p) => p.n) * 0.8);
    const band = (n) => 1.96 * Math.sqrt((o.p0 * (1 - o.p0)) / n);
    const yVals = [...o.points.map((p) => p.p), o.p0 + band(nMin), o.p0 - band(nMin)];
    const y = d3.scaleLinear([Math.max(0, d3.min(yVals) - 0.02), Math.min(1, d3.max(yVals) + 0.02)], [H - 42, top]).nice();
    const L = measure(svg, y.ticks(6).map(d3.format('.0%'))) + 30;
    const R = W - 12;
    const x = d3.scaleLinear([nMin, nMax], [L, R]);
    yGrid(svg, y, d3.format('.0%'), L, R, 6);
    svg.append('g').selectAll('text').data(x.ticks(8)).join('text').attr('class', 'tick').attr('x', x).attr('y', H - 24).attr('text-anchor', 'middle').text(d3.format('~f'));
    axisTitle(svg, 'Graded games (sample size)', (L + R) / 2, H - 4);
    axisTitle(svg, o.yLabel, 11, (top + H - 42) / 2, true);
    const ns = d3.range(nMin, nMax, (nMax - nMin) / 80).concat([nMax]);
    svg.append('path').datum(ns).attr('fill', C.col.blue()).attr('opacity', 0.14)
      .attr('d', d3.area().x(x).y0((n) => y(Math.max(0, o.p0 - band(n)))).y1((n) => y(Math.min(1, o.p0 + band(n)))));
    svg.append('line').attr('class', 'ref').attr('x1', L).attr('x2', R).attr('y1', y(o.p0)).attr('y2', y(o.p0));
    const color = (p) => (p.p > o.p0 + band(p.n) ? C.col.good() : p.p < o.p0 - band(p.n) ? C.col.bad() : C.col.muted());
    const g = svg.append('g');
    g.selectAll('circle').data(o.points).join('circle')
      .attr('cx', (p) => x(p.n)).attr('cy', (p) => y(p.p)).attr('r', (p) => (p.label === o.selected ? 7 : 5.5))
      .attr('fill', color).attr('stroke', (p) => (p.label === o.selected ? 'var(--text)' : 'var(--panel)')).attr('stroke-width', 1.5)
      .attr('class', o.onClick ? 'clickable' : null)
      .on('mousemove', (event, p) => {
        const inside = Math.abs(p.p - o.p0) <= band(p.n);
        const lines = [{ label: o.yLabel, value: NE.f.pct(p.p) }, { label: 'Graded games', value: NE.f.int(p.n) }, { label: 'Chance band', value: `${NE.f.pct(Math.max(0, o.p0 - band(p.n)))}–${NE.f.pct(Math.min(1, o.p0 + band(p.n)))}` }, { label: 'Verdict', value: inside ? 'Could be chance' : 'Unlikely to be chance alone' }];
        if (o.onClick) lines.hint = 'Click to open this team';
        C.tip(event, p.label, lines);
      })
      .on('mouseleave', C.hide)
      .on('click', (event, p) => { if (o.onClick) { C.hide(); o.onClick(p.label); } });
    // Label the points outside the band.
    g.selectAll('text').data(o.points.filter((p) => Math.abs(p.p - o.p0) > band(p.n) || p.label === o.selected)).join('text')
      .attr('class', 'pt-label').attr('x', (p) => x(p.n) + 8).attr('y', (p) => y(p.p)).attr('dy', '0.32em').text((p) => p.label);
  };

  // ---- box plot per group ------------------------------------------------------------
  // o: { groups:[{label, values}], yLabel, onClick(label), h }
  C.box = (el, o) => {
    const groups = o.groups.filter((g) => g.values.length);
    if (!groups.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, o.h || 280);
    const all = groups.flatMap((g) => g.values);
    const y = d3.scaleLinear(d3.extent(all), [H - 28, 12]).nice();
    const L = measure(svg, y.ticks(6).map(d3.format('~f'))) + 30;
    const R = W - 8;
    const x = d3.scaleBand(groups.map((g) => String(g.label)), [L, R]).padding(0.35);
    yGrid(svg, y, d3.format('~f'), L, R, 6);
    axisTitle(svg, o.yLabel, 11, (12 + H - 28) / 2, true);
    xCats(svg, groups.map((g) => String(g.label)), (d) => x(d) + x.bandwidth() / 2, H - 8, W);
    const blue = C.col.blue();
    for (const gp of groups) {
      const v = gp.values.slice().sort((a, b) => a - b);
      const q1 = d3.quantileSorted(v, 0.25);
      const q2 = d3.quantileSorted(v, 0.5);
      const q3 = d3.quantileSorted(v, 0.75);
      const iqr = q3 - q1;
      const lo = d3.min(v.filter((d) => d >= q1 - 1.5 * iqr));
      const hi = d3.max(v.filter((d) => d <= q3 + 1.5 * iqr));
      const cx = x(String(gp.label)) + x.bandwidth() / 2;
      const bw = Math.min(x.bandwidth(), 46);
      const g = svg.append('g').attr('class', o.onClick ? 'clickable' : null);
      g.append('line').attr('class', 'box-w').attr('x1', cx).attr('x2', cx).attr('y1', y(lo)).attr('y2', y(hi));
      g.append('rect').attr('x', cx - bw / 2).attr('width', bw).attr('y', y(q3)).attr('height', Math.max(1, y(q1) - y(q3))).attr('rx', 3).attr('fill', blue).attr('fill-opacity', 0.28).attr('stroke', blue);
      g.append('line').attr('class', 'box-m').attr('x1', cx - bw / 2).attr('x2', cx + bw / 2).attr('y1', y(q2)).attr('y2', y(q2));
      const outl = v.filter((d) => d < lo || d > hi);
      g.selectAll('circle').data(outl).join('circle').attr('cx', cx).attr('cy', y).attr('r', 2.2).attr('fill', C.col.muted());
      g.append('rect').attr('x', cx - x.bandwidth() / 2).attr('width', x.bandwidth()).attr('y', 12).attr('height', H - 40).attr('fill', 'transparent')
        .on('mousemove', (event) => {
          const lines = [{ label: 'Median', value: d3.format('.1f')(q2) }, { label: 'Middle half', value: `${d3.format('~f')(q1)}–${d3.format('~f')(q3)}` }, { label: 'Range', value: `${d3.format('~f')(v[0])}–${d3.format('~f')(v[v.length - 1])}` }, { label: 'Std. deviation', value: d3.format('.1f')(d3.deviation(v) || 0) }, { label: 'Games', value: NE.f.int(v.length) }];
          if (o.onClick) lines.hint = 'Click to focus this season';
          C.tip(event, String(gp.label), lines);
        })
        .on('mouseleave', C.hide)
        .on('click', () => { if (o.onClick) { C.hide(); o.onClick(gp.label); } });
    }
  };

  // ---- heatmap (season x week) ------------------------------------------------------
  // o: { rows, cols, cell(r,c) -> {value, n} | null, kind, center?, onClick(r,c), colLabel }
  C.heat = (el, o) => {
    if (!o.rows.length) return C.empty(el);
    const cellH = 26;
    const H = 30 + o.rows.length * cellH + 26;
    const { svg, W } = svgFor(el, H);
    const L = measure(svg, o.rows.map(String)) + 12;
    const R = W - 8;
    const x = d3.scaleBand(o.cols.map(String), [L, R]).padding(0.06);
    const y = d3.scaleBand(o.rows.map(String), [24, 24 + o.rows.length * cellH]).padding(0.08);
    const cells = [];
    for (const r of o.rows) for (const c of o.cols) { const v = o.cell(r, c); if (v && v.value !== null) cells.push({ r, c, ...v }); }
    const ext = d3.extent(cells, (d) => d.value);
    let color;
    if (o.center !== undefined) {
      const m = Math.max(Math.abs(ext[0] - o.center), Math.abs(ext[1] - o.center)) || 1;
      color = d3.scaleLinear([o.center - m, o.center, o.center + m], [C.col.orange(), cssVar('--heat-mid'), C.col.blue()]).clamp(true);
    } else {
      color = d3.scaleLinear(ext, [cssVar('--heat-lo'), C.col.blue()]);
    }
    svg.append('g').selectAll('text').data(o.cols.filter((_, i) => i % (x.bandwidth() < 18 ? 2 : 1) === 0)).join('text').attr('class', 'tick').attr('x', (c) => x(String(c)) + x.bandwidth() / 2).attr('y', 14).attr('text-anchor', 'middle').text((c) => c);
    svg.append('g').selectAll('text').data(o.rows).join('text').attr('class', 'tick').attr('x', L - 8).attr('y', (r) => y(String(r)) + y.bandwidth() / 2).attr('dy', '0.32em').attr('text-anchor', 'end').text((r) => r);
    const fv = valOf(o.kind);
    svg.append('g').selectAll('rect').data(cells).join('rect')
      .attr('x', (d) => x(String(d.c))).attr('y', (d) => y(String(d.r))).attr('width', x.bandwidth()).attr('height', y.bandwidth()).attr('rx', 2)
      .attr('fill', (d) => color(d.value)).attr('class', o.onClick ? 'clickable' : null)
      .on('mousemove', (event, d) => {
        const lines = [{ label: o.label, value: fv(d.value) }, { label: 'Games', value: NE.f.int(d.n) }];
        if (o.onClick) lines.hint = 'Click to list these games';
        C.tip(event, `${d.r} · ${o.colLabel} ${d.c}`, lines);
      })
      .on('mouseleave', C.hide)
      .on('click', (event, d) => { if (o.onClick) { C.hide(); o.onClick(d.r, d.c); } });
    // scale key
    const kx = L;
    const ky = H - 14;
    const kw = Math.min(180, R - L);
    const grad = `heat-${Math.random().toString(36).slice(2, 8)}`;
    const lg = svg.append('defs').append('linearGradient').attr('id', grad);
    const dom = color.domain();
    const stops = dom.length === 3 ? dom : [dom[0], dom[1]];
    stops.forEach((s, i) => lg.append('stop').attr('offset', `${(i / (stops.length - 1)) * 100}%`).attr('stop-color', color(s)));
    svg.append('rect').attr('x', kx).attr('y', ky - 6).attr('width', kw).attr('height', 8).attr('rx', 2).attr('fill', `url(#${grad})`);
    svg.append('text').attr('class', 'tick').attr('x', kx - 6).attr('y', ky).attr('text-anchor', 'end').text(fv(stops[0]));
    svg.append('text').attr('class', 'tick').attr('x', kx + kw + 6).attr('y', ky).text(fv(stops[stops.length - 1]));
  };

  // ---- strip: dots per group on one axis (simulator) -----------------------------------
  // o: { groups:[{name, color, points:[{v,label}]}], center, kind }
  C.strip = (el, o) => {
    const { svg, W } = svgFor(el, 40 + o.groups.length * 64 + 30);
    const H = 40 + o.groups.length * 64 + 30;
    const all = o.groups.flatMap((g) => g.points.map((p) => p.v));
    if (!all.length) return C.empty(el);
    const m = Math.max(0.12, d3.max(all, (v) => Math.abs(v - o.center)) * 1.1);
    const L = measure(svg, o.groups.map((g) => g.name)) + 16;
    const R = W - 12;
    const x = d3.scaleLinear([o.center - m, o.center + m], [L, R]);
    const ticks = x.ticks(8);
    svg.append('g').selectAll('line').data(ticks).join('line').attr('class', 'grid').attr('x1', x).attr('x2', x).attr('y1', 20).attr('y2', H - 26);
    svg.append('g').selectAll('text').data(ticks).join('text').attr('class', 'tick').attr('x', x).attr('y', H - 9).attr('text-anchor', 'middle').text(d3.format('.0%'));
    svg.append('line').attr('class', 'ref').attr('x1', x(o.center)).attr('x2', x(o.center)).attr('y1', 16).attr('y2', H - 26);
    o.groups.forEach((gp, gi) => {
      const cy = 50 + gi * 64;
      svg.append('text').attr('class', 'tick').attr('x', L - 10).attr('y', cy).attr('dy', '0.32em').attr('text-anchor', 'end').text(gp.name);
      // simple beeswarm: offset dots that would overlap
      const placed = [];
      const pts = gp.points.slice().sort((a, b) => a.v - b.v).map((p) => {
        const px = x(p.v);
        let dy = 0;
        for (let k = 0; k < 12; k += 1) {
          dy = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 7;
          if (!placed.some((q) => Math.abs(q.px - px) < 7 && Math.abs(q.dy - dy) < 7)) break;
        }
        placed.push({ px, dy });
        return { ...p, px, cy: cy + dy };
      });
      svg.append('g').selectAll('circle').data(pts).join('circle').attr('cx', (p) => p.px).attr('cy', (p) => p.cy).attr('r', 3.6)
        .attr('fill', gp.color).attr('fill-opacity', 0.85)
        .on('mousemove', (event, p) => C.tip(event, p.label, [{ label: o.valueLabel, value: NE.f.pct(p.v) }]))
        .on('mouseleave', C.hide);
      const sd = d3.deviation(gp.points, (p) => p.v);
      svg.append('text').attr('class', 'strip-sd').attr('x', R).attr('y', cy - 24).attr('text-anchor', 'end').text(`spread (std. dev.) ${d3.format('.1f')((sd || 0) * 100)} pts`);
    });
  };

  // ---- calibration ----------------------------------------------------------------------
  C.calib = (el, rows) => {
    if (!rows.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, 300);
    const top = legend(svg, [{ label: 'Favorites, grouped by price', color: C.col.blue() }, { label: 'Price matched the result', color: C.col.ref(), line: true, dash: true }], W) + 10;
    const y = d3.scaleLinear([0.4, 1], [H - 42, top]);
    const L = measure(svg, ['100%']) + 30;
    const R = W - 12;
    const x = d3.scaleLinear([0.5, 1], [L, R]);
    yGrid(svg, y, d3.format('.0%'), L, R);
    svg.append('g').selectAll('text').data(x.ticks(5)).join('text').attr('class', 'tick').attr('x', x).attr('y', H - 24).attr('text-anchor', 'middle').text(d3.format('.0%'));
    axisTitle(svg, 'No-vig implied win chance', (L + R) / 2, H - 4);
    axisTitle(svg, 'Actual win %', 11, (top + H - 42) / 2, true);
    svg.append('line').attr('class', 'ref').attr('x1', x(0.5)).attr('y1', y(0.5)).attr('x2', x(1)).attr('y2', y(1));
    const w = svg.append('g').attr('class', 'whisker');
    for (const r of rows) w.append('line').attr('x1', x(r.imp)).attr('x2', x(r.imp)).attr('y1', y(Math.max(0.4, r.lo))).attr('y2', y(r.hi));
    svg.append('path').datum(rows).attr('class', 'line').attr('stroke', C.col.blue()).attr('d', d3.line().x((r) => x(r.imp)).y((r) => y(r.won)));
    const rs = d3.scaleSqrt([0, d3.max(rows, (r) => r.n)], [3, 11]);
    svg.append('g').selectAll('circle').data(rows).join('circle').attr('class', 'dot').attr('cx', (r) => x(r.imp)).attr('cy', (r) => y(r.won)).attr('r', (r) => rs(r.n)).attr('fill', C.col.blue())
      .on('mousemove', (event, r) => C.tip(event, `Implied ${r.bucket}`, [{ label: 'Avg implied', value: NE.f.pct(r.imp) }, { label: 'Actual win %', value: NE.f.pct(r.won) }, { label: '95% range', value: `${NE.f.pct(r.lo)}–${NE.f.pct(r.hi)}` }, { label: 'Games', value: NE.f.int(r.n) }]))
      .on('mouseleave', C.hide);
  };

  // ---- per-game bars (team game log) ------------------------------------------------------
  // o: { rows:[{label, value, color, id}], onClick(id), yLabel }
  C.gameBars = (el, o) => {
    if (!o.rows.length) return C.empty(el);
    const { svg, W, H } = svgFor(el, o.h || 230);
    const ext = d3.extent(o.rows, (r) => r.value);
    const m = Math.max(Math.abs(ext[0]), Math.abs(ext[1])) || 1;
    const y = d3.scaleLinear([-m, m], [H - 16, 10]).nice();
    const L = measure(svg, y.ticks(5).map(d3.format('+~f'))) + 30;
    const R = W - 8;
    const x = d3.scaleBand(o.rows.map((_, i) => i), [L, R]).padding(0.15);
    yGrid(svg, y, d3.format('+~f'), L, R);
    axisTitle(svg, o.yLabel, 11, H / 2, true);
    svg.append('line').attr('class', 'axis').attr('x1', L).attr('x2', R).attr('y1', y(0)).attr('y2', y(0));
    svg.append('g').selectAll('rect').data(o.rows).join('rect')
      .attr('x', (_, i) => x(i)).attr('width', x.bandwidth()).attr('y', (r) => Math.min(y(r.value), y(0))).attr('height', (r) => Math.max(1, Math.abs(y(r.value) - y(0))))
      .attr('rx', Math.min(2, x.bandwidth() / 2)).attr('fill', (r) => r.color).attr('class', o.onClick ? 'clickable' : null)
      .on('mousemove', (event, r) => C.tip(event, r.label, Object.assign(r.lines || [], { hint: o.onClick ? 'Click to open this game' : undefined })))
      .on('mouseleave', C.hide)
      .on('click', (event, r) => { if (o.onClick) { C.hide(); o.onClick(r.id); } });
  };

  // ---- sparkline for KPI tiles ---------------------------------------------------------
  C.spark = (el, values, color) => {
    el.replaceChildren();
    const v = values.filter((d) => d !== null && d !== undefined);
    if (v.length < 2) return;
    const W = 120;
    const H = 26;
    const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', '100%').attr('height', H).attr('preserveAspectRatio', 'none');
    const x = d3.scaleLinear([0, values.length - 1], [2, W - 2]);
    const y = d3.scaleLinear(d3.extent(v), [H - 3, 3]);
    svg.append('path').attr('d', d3.line().defined((d) => d !== null).x((_, i) => x(i)).y((d) => y(d))(values)).attr('class', 'spark').attr('stroke', color || C.col.blue());
    const last = values.length - 1;
    if (values[last] !== null) svg.append('circle').attr('cx', x(last)).attr('cy', y(values[last])).attr('r', 2.4).attr('fill', color || C.col.blue());
  };
})();

// NFL EDGE: views. Each tab renders from NE.S (state) and NE.data() (filtered games).
'use strict';

(() => {
  const NE = window.NE;
  const C = NE.charts;
  const f = NE.f;
  const esc = NE.esc;
  const S = NE.S;

  // ---- small builders -----------------------------------------------------------

      ${body || `<div class="chart" data-chart="${id}"></div>`}
    </section>`;
  const kpi = ({ label, value, sub = '', def = '', spark = '', tone = '', patch = null, ci = '' }) => `
    <div class="kpi ${patch ? 'clickable' : ''} ${tone}" ${patch ? `data-go="${go(patch)}" tabindex="0" role="button"` : ''}>

      <span class="kpi-v">${value}</span>
      ${ci ? `<span class="kpi-ci">${ci}</span>` : ''}
      ${sub ? `<span class="kpi-s">${sub}</span>` : ''}
      ${spark ? `<span class="kpi-spark" data-spark="${spark}"></span>` : ''}
      ${def ? `<span class="kpi-d">${def}</span>` : ''}
    </div>`;
  const sel = (key, options, value, label) => `
    <label class="ctl"><span>${label}</span><select data-key="${key}">${options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(value) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  const seg = (key, options, value) => `
    <div class="seg" role="group">${options.map(([v, l]) => `<button type="button" data-go="${go({ [key]: v })}" aria-pressed="${String(v) === String(value)}">${esc(l)}</button>`).join('')}</div>`;
  const teamOptions = (any) => [...(any ? [['', any]] : []), ...NE.teams.map((t) => [t, t])];
  const verdict = (r, what) => {
    if (!r || r.lo === null) return '';
    if (r.lo > 0.5) return `<span class="pill good">Above 50%, beyond chance</span>`;
    if (r.hi < 0.5) return `<span class="pill bad">Below 50%, beyond chance</span>`;
    return `<span class="pill neutral" title="The 95% range includes 50%">Within chance of 50% ${what ? `(${what})` : ''}</span>`;
  };
  const draw = (id, fn) => { const el = view.querySelector(`[data-chart="${id}"]`); if (el) fn(el); };
  const spark = (id, values, color) => { const el = view.querySelector(`[data-spark="${id}"]`); if (el) C.spark(el, values, color); };
  const empty = () => `<div class="card"><p class="empty">No games match these filters. Widen the seasons or reset the filters.</p></div>`;
  const periodGroups = (games) => {
    const key = NE.trendKey();
    const groups = NE.groupBy(games, key);
    return { key, label: key === 'week' ? 'Week' : 'Season', cats: groups.map((g) => g[0]), groups: groups.map((g) => g[1]) };
  };
  const metricSeries = (metric, groups) => {
    const pts = groups.map((g) => NE.metricPoint(metric, g));
    return { values: pts.map((p) => p.value), lo: pts.map((p) => p.lo ?? null), hi: pts.map((p) => p.hi ?? null), n: pts.map((p) => p.n) };
  };
  // Click on a period: a season narrows the filters to it; a week opens those games.
  const drill = (P) => (i) => {

  };

  const openGame = (id) => NE.set({ tab: 'games', game: id });

  // =================================================================================
  // STORY: a fixed narrative over every season; numbers are computed live.

  const story = () => {
    const G = NE.games;
    const TG = NE.teamGames;
    const bySeason = NE.groupBy(G, 'season');
    const seasons = bySeason.map((s) => s[0]);
    const tot = bySeason.map(([, g]) => NE.mean(g, 'total_pts'));
    const peak = seasons[d3.maxIndex(tot)];
    const low = seasons[d3.minIndex(tot)];
    const home = bySeason.map(([, g]) => NE.metricPoint('home_win', g));
    const home20 = home[seasons.indexOf(2020)];

    const full = seasons.map((s, i) => [s, home[i].value]).filter(([s]) => s < NE.latestSeason);
    const lowestFull = full.length ? full.reduce((a, b) => (b[1] < a[1] ? b : a))[0] : null;

        ${chapter(4, 'Totals', `Closing totals miss by ${f.n1(totalMae)} points a game, yet overs hit ${f.pct(overAll.pct)}`,

        ${chapter(5, 'Signal vs. noise', outside === 0 ? `Not one of ${teams.length} teams has a spread record that chance can’t explain` : `Only ${outside} of ${teams.length} teams have a spread record that chance can’t explain`,

        <section class="takeaways card">

            <li><b>Prefer patterns that persist.</b> Win rates and point differential carry from season to season; cover rates mostly do not.</li>

    draw('st-scoring', (el) => C.line(el, { cats: seasons, xLabel: 'Season', series: [{ name: 'Combined points', color: C.col.blue(), values: tot, ...ciMean(bySeason, 'total_pts') }, { name: 'Closing total', color: C.col.orange(), values: bySeason.map(([, g]) => NE.mean(g, 'total_line')), dash: true }], onClick: (i) => NE.set({ tab: 'overview', s0: seasons[i], s1: seasons[i], metric: 'avg_total' }), hint: 'Click to open this season' }));
